<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - OG Bike Rentals</title>
  <link rel="stylesheet" href="/css/global.css">
</head>

<body>

  <!-- Sticky Navbar (Home link only for clean look) -->
  <nav>
    <a href="/" class="logo">🏍 OGBikeRentals</a>
    <ul class="nav-links">
      <li><a href="/">Back to Home</a></li>
    </ul>
  </nav>

  <!-- Login Main Wrapper -->
  <div class="auth-wrapper">
    <div class="auth-blur-glow"></div>
    <div class="auth-card">
      <div class="logo" style="justify-content: center; margin-bottom: 10px;">🏍</div>
      <h2>Welcome Back</h2>
      <p class="auth-subtitle">Sign in to book a ride and manage your rentals</p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="name@domain.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required
            autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary auth-btn">Sign In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/signup">Create one free</a>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    // Redirect if already logged in
    document.addEventListener('DOMContentLoaded', async () => {
      const authState = await checkAuthSession();
      if (authState.authenticated) {
        window.location.href = '/dashboard';
      }
    });

    // Form Submission Handling
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showNotification('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 1000);
        } else {
          showNotification(data.message || 'Login failed. Please check your credentials.', 'error');
        }
      } catch (error) {
        console.error('Login submit error:', error);
        showNotification('An error occurred. Please try again later.', 'error');
      }
    });
  </script>
</body>

</html>
